<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RastiChat | راستی چت</title>
    <link rel="stylesheet" href="/portal-style.css">
</head>

<body>

<main class="page">

    <section class="box">

        <div class="logo">R</div>

        <h1>RastiChat</h1>
        <h2>راستی چت</h2>

        <p class="intro">
            سامانه ارتباط و پشتیبانی آنلاین
        </p>

        <div class="buttons">

            <a class="card guest" href="/guest/">
                <span class="icon">💬</span>
                <span>
                    <strong>ورود مهمان</strong>
                    <small>شروع گفتگو بدون نیاز به ورود</small>
                </span>
            </a>

            <a class="card admin" href="/admin/login">
                <span class="icon">👨‍💼</span>
                <span>
                    <strong>ورود مدیر / اپراتور</strong>
                    <small>پاسخ به مشتریان و ارتباط با پلتفرم</small>
                </span>
            </a>

            <a class="card platform" href="/platform/login">
                <span class="icon">⚙️</span>
                <span>
                    <strong>مدیریت پلتفرم</strong>
                    <small>ورود مدیریت مرکزی RastiChat</small>
                </span>
            </a>

        </div>

        <p class="footer">
            RastiChat — ارتباط ساده، سریع و مستقیم
        </p>

    </section>

</main>

</body>
</html>
