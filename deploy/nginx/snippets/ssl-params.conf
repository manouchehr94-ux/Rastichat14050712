# Deliberately self-contained rather than including certbot's
# options-ssl-nginx.conf/ssl-dhparams.pem — those are only written when
# certbot's own --nginx plugin runs, and scripts/nginx/issue-certs.sh uses
# --webroot instead (so certbot never touches this repo's Nginx config
# directly, matching "do not overwrite /etc/nginx blindly"). Mozilla
# "Intermediate" compatibility baseline (TLS 1.2+, modern-but-broadly-
# supported cipher list).
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:RastiChatSSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
