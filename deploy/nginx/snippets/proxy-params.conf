# Standard reverse-proxy headers, shared by every RastiChat upstream.
# X-Forwarded-Proto is what makes settings.SECURE_PROXY_SSL_HEADER work —
# without it Django can't tell this request arrived over HTTPS (it only
# ever sees the plain-HTTP hop from Nginx) and would loop-redirect.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Request-ID $request_id;

# Found on the isolated staging stack: Django's SecurityMiddleware and snippets/security-headers.conf both set these four
# headers, so every proxied response carried each of them twice ("nosniff, nosniff", two HSTS lines, ...). nginx's copy is the
# authoritative one for every upstream (the dashboards set none), so drop the upstream's duplicate before nginx adds its own.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header Strict-Transport-Security;
