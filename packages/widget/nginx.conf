server {
    listen 8080;
    server_tokens off;

    root /usr/share/nginx/html;

    location = / {
        try_files /examples/portal/index.html =404;
    }

    location = /portal-style.css {
        try_files /examples/portal/style.css =404;
    }

    location = /widget.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /widget.js =404;
    }

    location ~ ^/widget/[^/]+/widget\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /guest/ {
        try_files /examples/guest/index.html =404;
    }

    location = /guest/app.js {
        try_files /examples/guest/app.js =404;
    }

    location = /guest/style.css {
        try_files /examples/guest/style.css =404;
    }

    location /examples/customer-test/ {
        try_files $uri $uri/ /examples/customer-test/index.html;
    }

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri =404;
    }
}
