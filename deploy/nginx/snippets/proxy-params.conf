# Standard reverse-proxy headers, shared by every RastiChat upstream.
# X-Forwarded-Proto is what makes settings.SECURE_PROXY_SSL_HEADER work —
# without it Django can't tell this request arrived over HTTPS (it only
# ever sees the plain-HTTP hop from Nginx) and would loop-redirect.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Request-ID $request_id;
