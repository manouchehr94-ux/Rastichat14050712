# Included in addition to proxy-params.conf on any location proxying to
# Daphne's WebSocket endpoints (/ws/...). Nginx does not forward the
# Upgrade/Connection handshake headers by default on a proxy_pass — without
# these, every WSS connection attempt fails at the handshake.
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
# `$connection_upgrade` is a map defined once in conf.d/rastichat-websocket-map.conf
# (an http-context directive, so it can't live in a server block) — falls
# back to "close" for any request that isn't itself a WebSocket upgrade.
proxy_set_header Connection $connection_upgrade;
# A support chat can legitimately sit open and idle for a while between
# messages — well above Nginx's 60s proxy_read_timeout default would drop a
# perfectly healthy idle connection out from under the customer.
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
