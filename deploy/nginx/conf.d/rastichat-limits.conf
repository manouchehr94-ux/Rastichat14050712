# http-context rate/connection limit zones — see the note in
# rastichat-websocket-map.conf about why this lives in conf.d rather than
# a server block. Deliberately a second, coarser layer alongside (not
# instead of) the DRF ScopedRateThrottle scopes in backend/config/settings.py
# — those are precise (per-endpoint, per-user-or-IP, aware of application
# state) but only run once a request has already reached Daphne; these stop
# abusive traffic at the edge before it costs a backend worker anything,
# and they're the only layer that can rate-limit the WebSocket handshake
# itself (a DRF throttle never runs on it) or cap raw concurrent
# connections per IP.
limit_req_zone $binary_remote_addr zone=rastichat_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=rastichat_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=rastichat_ws_connect:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=rastichat_ws_conn:10m;
