# Access-log redaction (compensating control for old clients that still put a credential in the URL).
#
# Old widget bundles connect to /ws/widget/<visitor-session-token>/<conversation>/ and old dashboards to
# /ws/dashboard/<jwt>/..., /ws/dashboard/support/<jwt>/..., /ws/notifications/<jwt>/ ; some REST calls carry
# `?session_token=`. The default `combined` log format would record those secrets. Sites use the
# `rastichat_redacted` format below instead: the credential path segment is replaced with `[redacted]` and the
# query string is NOT logged at all. http{} context only (this file belongs in /etc/nginx/conf.d/, like the
# other rastichat-*.conf files).
#
# Verify with scripts/nginx/test-log-redaction.sh (needs the nginx binary; runs on a high local port, touches
# nothing else). Logs written BEFORE this format was deployed may still contain credentials — rotate/delete them
# per your retention policy (see docs/runbooks/WS_TICKETS_AND_URL_CREDENTIALS.md).
map $uri $rastichat_logged_uri {
    default                                                         $uri;
    ~^(?<rc_a_pre>/ws/widget/)[^/]+(?<rc_a_post>/.*)$               "${rc_a_pre}[redacted]${rc_a_post}";
    ~^(?<rc_b_pre>/ws/dashboard/support/)[^/]+(?<rc_b_post>/.*)$    "${rc_b_pre}[redacted]${rc_b_post}";
    ~^(?<rc_c_pre>/ws/dashboard/)(?!v2/|support/)[^/]+(?<rc_c_post>/.*)$ "${rc_c_pre}[redacted]${rc_c_post}";
    ~^(?<rc_d_pre>/ws/notifications/)[^/]+(?<rc_d_post>/?)$           "${rc_d_pre}[redacted]${rc_d_post}";
}

log_format rastichat_redacted '$remote_addr - $remote_user [$time_local] '
                              '"$request_method $rastichat_logged_uri $server_protocol" '
                              '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
