# `map` (like `limit_req_zone`) is only valid in the http{} context, which
# a sites-enabled server block cannot provide on its own — this file is
# meant to be dropped into /etc/nginx/conf.d/, which Ubuntu's default
# nginx.conf already `include`s from inside http{} (see
# scripts/nginx/install-sites.sh, which checks for that before relying on
# it). Standard connection_upgrade map recommended by Nginx's own
# WebSocket proxying docs.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
