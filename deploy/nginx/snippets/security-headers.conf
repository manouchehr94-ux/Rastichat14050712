# Included from every RastiChat server block. Defense-in-depth alongside
# (not instead of) the equivalent headers Django's own SecurityMiddleware
# sets for its own responses (see backend/config/settings.py) — these also
# cover the two Next.js dashboards' responses and Nginx's own error pages,
# neither of which go through Django's middleware.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
# HSTS is set here (not left to Django alone) so it also applies to a
# request that never reaches the app — a static asset served straight by
# Nginx, or a 502 while the backend is deploying.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
